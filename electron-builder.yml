appId: com.claudeteam.app
productName: ClaudeTeam
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - node_modules/**/*
  - "!node_modules/**/README*"
  - "!node_modules/**/*.md"
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
